function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function estadoClass(p){return p===null?'':(p>=APROB?'aprob':'desaprob');}
function uid(){return 's'+Math.random().toString(36).slice(2,9);}
function avg2(a,b){const v=[a,b].filter(x=>x!==null&&x!==undefined);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;}
function computeProm(r){
  if(!r)return null;
  const G=new Map();
  acols().forEach(c=>{const k=c.g||c.id,g=G.get(k)||{w:0,s:0,n:0},w=Number(c.w)||0,v=r[c.id];g.w+=w;if(v!==null&&v!==undefined&&v!==''){g.s+=w*Number(v);g.n+=w;}G.set(k,g);});
  let sw=0,ss=0;G.forEach(g=>{if(g.n>0){sw+=g.w;ss+=g.w*(g.s/g.n);}});
  return sw>0?Math.ceil(Math.round(ss/sw*1e6)/1e6):null;
}
function getRec(sid,curso,bim){return (DATA.records[sid]&&DATA.records[sid][curso]&&DATA.records[sid][curso][bim])||null;}
function promAlumnoCurso(sid,curso,bim){return computeProm(getRec(sid,curso,bim));}
function promAlumnoGeneral(sid,bim){
  const vals=CURSOS.map(c=>promAlumnoCurso(sid,c,bim)).filter(v=>v!==null);
  return vals.length? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*100)/100 : null;
}
let CAMPOS=[];
function pctLleno(r){
  if(!r)return 0;
  const n=CAMPOS.filter(c=>r[c]!==null&&r[c]!==undefined&&r[c]!=='').length;
  return Math.round(n/CAMPOS.length*100);
}
function pctColor(p){return p>=100?'var(--green)':(p===0?'var(--red)':'#b7791f');}
function pctCell(sid,p){return `<td id="pct-${sid}" style="font-weight:600;color:${pctColor(p)}">${p}%</td>`;}
function grados(){return[...new Set(DATA.students.map(s=>s.grado))].sort((a,b)=>a-b);}
function studentsOf(g){return DATA.students.filter(s=>s.grado==g).sort((a,b)=>a.nombre.localeCompare(b.nombre));}

let AREA={id:'',name:'',cursos:[],cursosOff:[],cols:[]};
function acols(){return AREA.cols.filter(c=>!c.off);}
function applyConfig(cfg){
  AREA.cursos=[...cfg.cursos];AREA.cursosOff=[...(cfg.cursosOff||[])];AREA.cols=cfg.cols.map(c=>({...c}));
  CURSOS=AREA.cursos;CAMPOS=acols().map(c=>c.id);
}
function groups(){const m=new Map();acols().forEach(c=>{const k=c.g||c.id;if(!m.has(k))m.set(k,{k,label:c.g||c.name,cols:[]});m.get(k).cols.push(c);});return [...m.values()];}
function gval(r,g){const v=g.cols.map(c=>r?r[c.id]:null).filter(x=>x!==null&&x!==undefined&&x!=='').map(Number);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100:null;}
function compsList(){return groups().map(g=>[g.k,g.label]);}
function pendCats(){const m=new Map();acols().forEach(c=>{if(c.ent){if(!m.has(c.ent))m.set(c.ent,[]);m.get(c.ent).push(c);}});return [...m];}
function pendHead(e){return /s$/i.test(e)?`${e} que faltan`:`Pendiente: ${e}`;}
function pendTitulo(){const c=pendCats();return 'Pendientes de entrega'+(c.length?': '+c.map(x=>x[0].toLowerCase()).join(' y '):'');}
function pendNota(){const c=pendCats();return (c.length?`Se consideran pendientes las notas de ${c.map(x=>x[0]).join(' o ')} que están vacías.`:'Marca columnas como «Entregable» en Configurar para ver aquí lo que falta entregar.')+' Un alumno sin ninguna nota registrada aparece como «Sin registro».';}

/* Usuario sin correo real: 'mate.lopez' se convierte en mate.lopez@example.com */
const DOMINIO_USUARIOS='example.com';
function aCorreo(v){v=(v||'').trim();if(v.includes('@'))return v;return v.toLowerCase().replace(/\s+/g,'')+'@'+DOMINIO_USUARIOS;}
function verU(e){return e&&e.endsWith('@'+DOMINIO_USUARIOS)?e.slice(0,-(DOMINIO_USUARIOS.length+1)):e;}
let ISADMIN=false,PROFS=null;
async function afterLogin(areaPref){
  const uidu=session.user.id;
  const {data:pf,error}=await sb.from('profiles').select('area,approved,is_admin').eq('user_id',uidu).maybeSingle();
  if(error)alert('Falta preparar la base de datos: ejecuta migracion_areas.sql y luego migracion_admin.sql en Supabase. Detalle: '+error.message);
  let area=pf&&pf.area,ok=!!(pf&&pf.approved);ISADMIN=!!(pf&&pf.is_admin);PROFS=null;
  if(!pf){
    const a=areaPref||(session.user.user_metadata||{}).area;
    if(a&&AREAS[a]){const r=await sb.from('profiles').insert({user_id:uidu,area:a,email:session.user.email,approved:false,is_admin:false});if(!r.error){area=a;ok=false;}}
  }
  if(!area){renderAreaPicker();return false;}
  AREA.id=area;AREA.name=AREAS[area];
  if(!ok&&!ISADMIN){renderPendiente();return false;}
  await setArea(area);return true;
}

function wireAdmin(){
  const m=document.getElementById('main');if(!m)return;
  const find=id=>PROFS&&PROFS.find(p=>p.user_id===id);
  const upd=async(id,patch)=>{const {error}=await sb.from('profiles').update(patch).eq('user_id',id);if(error){alert('No se pudo guardar: '+error.message);return;}await loadProfiles();};
  m.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>upd(b.dataset.ap,{approved:true}));
  m.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{const p=find(b.dataset.rj);askConfirm(p.approved?'¿Quitar acceso?':'¿Rechazar la cuenta?',`${esc(verU(p.email)||'Esta cuenta')} ${p.approved?'ya no podrá entrar a registrar notas. Sus notas se conservan.':'no podrá registrar notas.'}`,'Sí, continuar',async()=>{const {error}=await sb.from('profiles').delete().eq('user_id',p.user_id);if(error)alert('No se pudo: '+error.message);else await loadProfiles();});});
  m.querySelectorAll('[data-ar]').forEach(sel=>sel.onchange=()=>{const p=find(sel.dataset.ar),v=sel.value;sel.value=p.area;askConfirm('¿Cambiar de área?',`${esc(verU(p.email)||'Esta cuenta')} pasará a ${esc(AREAS[v])}.`,'Sí, cambiar',()=>upd(p.user_id,{area:v}),false);});
  m.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{const p=find(b.dataset.ad);askConfirm(p.is_admin?'¿Quitar rol de administrador?':'¿Hacer administrador?',p.is_admin?`${esc(verU(p.email))} dejará de administrar cuentas.`:`${esc(verU(p.email))} podrá aprobar cuentas, ver todas las áreas y eliminar alumnos.`,'Sí, continuar',()=>upd(p.user_id,{is_admin:!p.is_admin}),false);});
  const ar=document.getElementById('admArea');
  if(ar)ar.onchange=async()=>{
    if(modCount()>0){alert('Primero guarda las notas que modificaste.');ar.value=AREA.id;return;}
    await setArea(ar.value);window._rc=window._ac=window._repC=window._ras=null;render();
  };
}

  applyConfig((data&&data.config)||DEF[id]);
  await loadAllData();
}

function askConfirm(title,msg,ok,cb,danger){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="box" role="dialog" aria-modal="true" style="max-width:390px;width:90vw"><h3 style="margin:0 0 8px;font-size:1.2rem">${title}</h3><div style="color:#667085;font-size:.92rem;line-height:1.5;text-align:left">${msg}</div><div class="lo-btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn ${danger===false?'':'warn'}" data-y>${ok}</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('[data-n]').onclick=()=>o.remove();
  o.querySelector('[data-y]').onclick=()=>{o.remove();cb();};
  o.onclick=e=>{if(e.target===o)o.remove();};
}
function openConfig(){
  const D={cu:AREA.cursos.map(n=>({n,o:n})),off:[...AREA.cursosOff],cols:AREA.cols.map(c=>({...c}))};
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="box cfgbox"></div>';
  document.body.appendChild(ov);const B=ov.firstChild;
  const tot=()=>D.cols.filter(c=>!c.off).reduce((a,c)=>a+(Number(c.w)||0),0);
  const upT=()=>{const t=B.querySelector('#tt');if(t){t.textContent=tot()+'%';t.style.color=tot()===100?'#3a47c4':'#b7791f';}};
  const rid=()=>'k'+Math.random().toString(36).slice(2,7);
  function draw(){
    const ac=D.cols.filter(c=>!c.off),hc=D.cols.filter(c=>c.off);
    B.innerHTML=`<h3 style="margin:0 0 4px;font-size:1.25rem">Configurar · ${esc(AREA.name)}</h3><div class="sub" style="margin:0 0 14px">Elige qué vas a calificar y cuánto pesa cada columna en el promedio. Nada cambia hasta que guardes y confirmes.</div>
    <b>Columnas de calificación</b>
    ${ac.map(c=>`<div class="cfg-row"><input class="cn" data-c="${c.id}" value="${esc(c.name)}" placeholder="Nombre"><label class="pw">Peso <input type="number" min="0" max="100" data-w="${c.id}" value="${c.w}">%</label><label class="en"><input type="checkbox" data-e="${c.id}" ${c.ent?'checked':''}> Entregable</label><button class="rm" data-rc="${c.id}">Quitar</button></div>`).join('')}
    <div class="cfg-tot">Los pesos suman <b id="tt"></b> <span class="sub">(el promedio se calcula proporcional a los pesos)</span> <button class="btn ghost" data-eq style="min-height:34px;padding:4px 14px">Repartir por igual</button></div>
    <div class="cfg-row"><input class="cn" id="nc" placeholder="Nueva columna, ej. Exposición"><label class="pw">Peso <input type="number" id="nw" min="0" max="100" value="10">%</label><button class="btn ghost" data-ac style="min-height:36px">Agregar columna</button></div>
    ${hc.length?`<div class="sub" style="margin-top:8px">Ocultas: ${hc.map(c=>`${esc(c.name)} <a href="#" data-rs="${c.id}">Restaurar</a>`).join(' · ')}</div>`:''}
    <b style="display:block;margin-top:18px">Cursos del área</b>
    ${D.cu.map((c,i)=>`<div class="cfg-row"><input class="cn" data-cu="${i}" value="${esc(c.n)}"><button class="rm" data-rcu="${i}">Quitar</button></div>`).join('')}
    <div class="cfg-row"><input class="cn" id="ncu" placeholder="Nuevo curso"><button class="btn ghost" data-acu style="min-height:36px">Agregar curso</button></div>
    ${D.off.length?`<div class="sub" style="margin-top:8px">Ocultos: ${D.off.map((n,i)=>`${esc(n)} <a href="#" data-rcs="${i}">Restaurar</a>`).join(' · ')}</div>`:''}
    <div class="lo-btns" style="margin-top:20px"><button class="btn ghost" data-x>Cancelar</button><button class="btn" data-save>Guardar cambios</button></div>`;
    upT();
    const q=s=>B.querySelectorAll(s);
    q('[data-c]').forEach(i=>i.oninput=()=>{const c=D.cols.find(x=>x.id===i.dataset.c);if(c.ent===c.name)c.ent=i.value;c.name=i.value;});
    q('[data-w]').forEach(i=>i.oninput=()=>{D.cols.find(x=>x.id===i.dataset.w).w=Math.max(0,Math.min(100,Number(i.value)||0));upT();});
    q('[data-e]').forEach(i=>i.onchange=()=>{const c=D.cols.find(x=>x.id===i.dataset.e);if(i.checked)c.ent=c.ent||c.name;else delete c.ent;});
    q('[data-rc]').forEach(b=>b.onclick=()=>{const c=D.cols.find(x=>x.id===b.dataset.rc);if(ac.length<2){alert('Debe quedar al menos una columna.');return;}askConfirm('¿Quitar la columna?',`Vas a quitar «${esc(c.name)}». Las notas ya registradas en esa columna quedan ocultas, no se borran, y podrás restaurarlas.`,'Sí, quitar',()=>{c.off=true;draw();});});
    q('[data-rs]').forEach(a=>a.onclick=e=>{e.preventDefault();D.cols.find(x=>x.id===a.dataset.rs).off=false;draw();});
    q('[data-eq]')[0].onclick=()=>{const n=ac.length,b=Math.floor(100/n);ac.forEach((c,i)=>c.w=i===n-1?100-b*(n-1):b);draw();};
    q('[data-ac]')[0].onclick=()=>{const n=B.querySelector('#nc').value.trim();if(!n)return;D.cols.push({id:rid(),name:n,w:Math.max(0,Math.min(100,Number(B.querySelector('#nw').value)||0))});draw();};
    q('[data-cu]').forEach(i=>i.oninput=()=>{D.cu[i.dataset.cu].n=i.value;});
    q('[data-rcu]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rcu,c=D.cu[i];if(D.cu.length<2){alert('Debe quedar al menos un curso.');return;}askConfirm('¿Quitar el curso?',`Vas a quitar «${esc(c.n)}». Sus notas quedan guardadas y podrás restaurarlo.`,'Sí, quitar',()=>{D.cu.splice(i,1);D.off.push(c.o||c.n);draw();});});
    q('[data-rcs]').forEach(a=>a.onclick=e=>{e.preventDefault();const n=D.off.splice(+a.dataset.rcs,1)[0];D.cu.push({n,o:n});draw();});
    q('[data-acu]')[0].onclick=()=>{const n=B.querySelector('#ncu').value.trim();if(n){D.cu.push({n,o:null});draw();}};
    q('[data-x]')[0].onclick=()=>ov.remove();
    q('[data-save]')[0].onclick=guardar;
  }
  function guardar(){
    const ac=D.cols.filter(c=>!c.off),names=ac.map(c=>c.name.trim().toLowerCase()),cn=D.cu.map(c=>c.n.trim().toLowerCase());
    if(ac.some(c=>!c.name.trim())||names.length!==new Set(names).size){alert('Cada columna debe tener un nombre distinto y no vacío.');return;}
    if(D.cu.some(c=>!c.n.trim())||cn.length!==new Set(cn).size){alert('Cada curso debe tener un nombre distinto y no vacío.');return;}
    if(tot()<=0){alert('Los pesos deben sumar más de 0%.');return;}
    D.cols.forEach(c=>c.name=c.name.trim());D.cu.forEach(c=>c.n=c.n.trim());
    const m=[],old=AREA.cols;
    D.cols.forEach(c=>{const p=old.find(x=>x.id===c.id);
      if(!p){if(!c.off)m.push(`Agregas la columna «${esc(c.name)}» (${c.w}%)`);return;}
      if(!p.off&&c.off)m.push(`Quitas «${esc(p.name)}» (sus notas quedan guardadas)`);
      else if(p.off&&!c.off)m.push(`Restauras «${esc(c.name)}»`);
      if(!c.off){if(p.name!==c.name)m.push(`Renombras «${esc(p.name)}» como «${esc(c.name)}»`);if(Number(p.w)!==Number(c.w))m.push(`Peso de «${esc(c.name)}»: ${p.w}% → ${c.w}%`);}
    });
    const ren=D.cu.filter(c=>c.o&&c.o!==c.n);
    ren.forEach(c=>m.push(`Renombras el curso «${esc(c.o)}» como «${esc(c.n)}» (se actualizan sus notas)`));
    D.cu.filter(c=>!c.o).forEach(c=>m.push(`Agregas el curso «${esc(c.n)}»`));
    AREA.cursos.filter(n=>!D.cu.some(c=>c.o===n)).forEach(n=>m.push(`Quitas el curso «${esc(n)}» (sus notas quedan guardadas)`));
    if(!m.length){ov.remove();return;}
    askConfirm('¿Aplicar estos cambios?','<ul style="margin:0;padding-left:18px">'+m.map(x=>`<li>${x}</li>`).join('')+'</ul>','Sí, aplicar',async()=>{
      for(const c of ren){
        const {error}=await sb.from('grades').update({curso:c.n}).eq('area',AREA.id).eq('curso',c.o);
        if(error){alert('Error actualizando notas: '+error.message);return;}
        Object.values(DATA.records).forEach(rc=>{if(rc[c.o]){rc[c.n]=rc[c.o];delete rc[c.o];}});
      }
      const cfg={cursos:D.cu.map(c=>c.n),cursosOff:D.off,cols:D.cols};
      const {error}=await sb.from('area_config').upsert({area:AREA.id,config:cfg,updated_by:session.user.id,updated_at:new Date().toISOString()});
      if(error){alert('No se pudo guardar la configuración: '+error.message);return;}
      applyConfig(cfg);ov.remove();render();
    },false);
  }
  draw();
}

/* ---------- Carga de datos desde Supabase ---------- */
async function loadAllData(){
  const {data:studs,error:e1} = await sb.from('students').select('*');
  const {data:grds,error:e2} = await sb.from('grades').select('*').eq('area',AREA.id);
  if(e1||e2){ alert('Error cargando datos: '+((e1||e2).message)); return; }
  DATA.students = studs.map(s=>({id:s.id,nombre:s.nombre,grado:s.grado}));
  DATA.records = {};
  grds.forEach(r=>{
    DATA.records[r.sid]=DATA.records[r.sid]||{};
    DATA.records[r.sid][r.curso]=DATA.records[r.sid][r.curso]||{};
    DATA.records[r.sid][r.curso][r.bim]={...(r.scores||{})};
  });
}
async function upsertGradeRow(sid,curso,bim){
  const r=getRec(sid,curso,bim)||{},scores={};
  AREA.cols.forEach(c=>{scores[c.id]=r[c.id]??null;});
  const {error}=await sb.from('grades').upsert({sid,area:AREA.id,curso,bim,scores},{onConflict:'sid,area,curso,bim'});
  if(error) alert('Error guardando: '+error.message);
}
async function insertStudent(nombre,grado){
  const id=uid();
  const {error}=await sb.from('students').insert({id,nombre,grado});
  if(error){ alert('Error agregando alumno: '+error.message); return null; }
  DATA.students.push({id,nombre,grado});
  return id;
}
async function deleteStudentRemote(id){
  const {error}=await sb.from('students').delete().eq('id',id);
  if(error){ alert('Error eliminando: '+error.message); return; }
  DATA.students=DATA.students.filter(s=>s.id!==id);
  delete DATA.records[id];
}
function setField(sid,curso,bim,field,val){
  DATA.records[sid]=DATA.records[sid]||{};
  DATA.records[sid][curso]=DATA.records[sid][curso]||{};
  DATA.records[sid][curso][bim]=DATA.records[sid][curso][bim]||{};
  DATA.records[sid][curso][bim][field]= val===''? null : Math.max(0,Math.min(20,Number(val)));
}

const LKI='<svg class="lki" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function cellHtml(attrs,val){

const normN=v=>v===''||v===null||v===undefined?'':String(Number(v));
function modCount(){return [...document.querySelectorAll('.nota-in[data-o]')].filter(i=>normN(i.value)!==normN(i.dataset.o)).length;}
function updCount(){
  const n=modCount(),c=document.getElementById('chgCnt');
  if(c){c.textContent=n?(n+(n===1?' cambio sin guardar':' cambios sin guardar')):'Sin cambios';c.classList.toggle('on',n>0);}

function wireLock(m){
  m.querySelectorAll('.nota-in[data-o]').forEach(inp=>{
    const box=inp.parentElement,pv=box.querySelector('.pv');let t=0;
    const upd=()=>{
      const md=normN(inp.value)!==normN(inp.dataset.o);
      box.classList.toggle('md',md);box.classList.toggle('lk',inp.readOnly);
      pv.textContent=md?'antes: '+(inp.dataset.o===''?'vacío':inp.dataset.o):'';
    };
    const unlock=()=>{inp.readOnly=false;upd();inp.focus();inp.select();};
    inp.addEventListener('click',()=>{if(!inp.readOnly)return;const n=Date.now();if(n-t<500)unlock();else t=n;});
    inp.addEventListener('keydown',e=>{if(inp.readOnly&&(e.key==='F2'||e.key===' ')){e.preventDefault();unlock();}});
    inp.addEventListener('input',()=>{upd();updCount();});
    inp.addEventListener('blur',()=>{if(!inp.readOnly&&normN(inp.value)===normN(inp.dataset.o)&&inp.dataset.o!==''){inp.value=inp.dataset.o;inp.readOnly=true;}upd();});
    upd();
  });
  const u=document.getElementById('undoChg');
  if(u)u.onclick=()=>{
    m.querySelectorAll('.nota-in[data-o]').forEach(i=>{
      if(normN(i.value)!==normN(i.dataset.o)){i.value=i.dataset.o;i.dispatchEvent(new Event('input',{bubbles:true}));}
      i.readOnly=i.dataset.o!=='';i.dispatchEvent(new Event('blur'));
    });
    window._dirtyA=false;updCount();
  };
  updCount();
}

const BASEC={'Razonamiento Matemático':'Razonamiento Mat.'};
function pendData(g,bim){
  const list=studentsOf(g),vacio=v=>v===null||v===undefined||v==='',cats=pendCats();
  const rows=list.map(s=>{
    const sin=CURSOS.every(c=>{const r=getRec(s.id,c,bim);return !r||CAMPOS.every(k=>vacio(r[k]));});
    const it=cats.map(([e,cs])=>sin?[]:CURSOS.map(c=>{const r=getRec(s.id,c,bim)||{},m=cs.filter(k=>vacio(r[k.id])).map(k=>k.sh||k.name);return m.length?`${BASEC[c]||c} (${m.join(', ')})`:null;}).filter(Boolean));
    return{s,sin,it};
  });
  const pend=rows.filter(x=>x.sin||x.it.some(a=>a.length));
  return{pend,cats,total:list.length,ok:list.length-pend.length};
}

function descargarPendientes(gl,bim){
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const NAVY=[27,42,65],RED=[180,68,61],ORD={1:'1.er',2:'2.º',3:'3.er',4:'4.º'},NG={1:'1ro',2:'2do',3:'3ro',4:'4to',5:'5to'};
  let first=true;
  gl.forEach(g=>{
    if(!studentsOf(g).length)return;
    if(!first)doc.addPage();first=false;
    const d=pendData(g,bim);

const PAL=['#5B5BF0','#2f8fe0','#f2a65a','#e4606d','#14a38b'];
const COMPS=[['cu','Cuaderno'],['li','Libro'],['co','Conducta'],['exM','Ex. Mensual'],['exB','Ex. Bimestral']];
const BK=[['0–5',0,6],['6–9',6,10],['10–12',10,13],['13–14',13,15],['15–16',15,17],['17–18',17,19],['19–20',19,21]];
const AF=()=>window._af=window._af||{g:'all',b:3};
const r2=x=>Math.round(x*100)/100, mean=a=>a.length?r2(a.reduce((x,y)=>x+y,0)/a.length):null;
const bset=b=>b==='all'?BIMS:[b];
const col=v=>v===null?'#c4c9d4':v<13?'#E4606D':v<14?'#F4B860':v<15?'#8EC5F0':v<17?'#5B8DEF':'#5B5BF0';
const tc=v=>(v!==null&&v>=13&&v<15)?'#17315a':'#fff';
function pcs(sid,c,b){return mean(bset(b).map(x=>promAlumnoCurso(sid,c,x)).filter(v=>v!==null));}
function pgen(sid,b){return mean(CURSOS.map(c=>pcs(sid,c,b)).filter(v=>v!==null));}
function lst(){const g=AF().g;return g==='all'?DATA.students:studentsOf(g);}
function vals(l,c,b){return l.map(s=>pcs(s.id,c,b)).filter(v=>v!==null);}
function stat(a){const n=a.length;if(!n)return{n:0,avg:null,ap:null,min:null,max:null,sd:null,fail:0};const m=a.reduce((x,y)=>x+y,0)/n;return{n,avg:r2(m),ap:Math.round(a.filter(v=>v>=APROB).length/n*100),min:Math.min(...a),max:Math.max(...a),sd:r2(Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n)),fail:a.filter(v=>v<APROB).length};}
function comp(l,c,b,k){const g=groups().find(x=>x.k===k);if(!g)return null;const o=[];l.forEach(s=>bset(b).forEach(x=>{const v=gval(getRec(s.id,c,x),g);if(v!==null)o.push(v);}));return mean(o);}
function weak(l,c,b){return compsList().map(([k,n])=>({l:n,v:comp(l,c,b,k)})).filter(x=>x.v!==null).sort((p,q)=>p.v-q.v)[0];}
const empty=t=>`<div class="empty">${t||'Aún no hay notas registradas para este filtro.'}</div>`;
const kpi=a=>`<div class="stat">${a.map(([v,l,c])=>`<div><b style="${c?'color:'+c:''}">${v}</b><span>${l}</span></div>`).join('')}</div>`;

function filtBar(o={}){const f=AF(),gs=grados();return `<div class="row no-print">${o.g===false?'':`<div><label>Grado</label><select id="afG"><option value="all" ${f.g==='all'?'selected':''}>Todo el colegio</option>${gs.map(g=>`<option value="${g}" ${f.g==g?'selected':''}>${g}°</option>`).join('')}</select></div>`}${o.b===false?'':`<div><label>Bimestre</label><select id="afB"><option value="all" ${f.b==='all'?'selected':''}>Todo el año</option>${BIMS.map(b=>`<option value="${b}" ${f.b===b?'selected':''}>${BIM_LABEL[b]} Bimestre</option>`).join('')}</select></div>`}${o.x||''}<button class="btn ghost" onclick="window.print()">Imprimir</button></div>`;}
function bars(items){return items.map(i=>`<div class="bar-row" ${i.a||''} data-tip="${esc(i.t||'')}" style="${i.a?'cursor:pointer':''}"><div class="bar-label">${esc(i.l)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,(i.v||0)/20*100)}%;background:${col(i.v)}"></div><i class="thr"></i></div><b style="width:110px;font-size:.8rem">${i.v??'—'} <span style="font-weight:400;color:#777">${i.s||''}</span></b></div>`).join('')||empty('Sin datos');}
function heat(b){return `<div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${CURSOS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${grados().map(g=>`<tr><th>${g}°</th>${CURSOS.map(c=>{const st=stat(vals(studentsOf(g),c,b));return `<td data-gg="${g}" data-gc="${esc(c)}" data-tip="${g}° · ${esc(c)}: prom. ${st.avg??'—'} · ${st.ap??'—'}% aprobados · ${st.n} alumnos" style="background:${col(st.avg)};color:${tc(st.avg)}">${st.avg??'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;}
function hist(a){const c=BK.map(([l,lo,hi])=>({l,lo,n:a.filter(v=>v>=lo&&v<hi).length})),mx=Math.max(1,...c.map(x=>x.n));return `<div style="display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px">${c.map(x=>`<div style="flex:1;text-align:center;font:12px 'Segoe UI',Arial" data-tip="${x.n} alumnos con promedio ${x.l}"><b>${x.n}</b><div style="height:${x.n/mx*100}px;background:${col(x.lo)};border-radius:3px 3px 0 0;min-height:2px"></div><div style="color:#666;margin-top:4px">${x.l}</div></div>`).join('')}</div>`;}
function line(S,L){const hid=window._hide||{},W=640,Ht=260,l=36,r=14,t=12,bt=28;const all=S.filter(s=>!hid[s.n]).flatMap(s=>s.d).filter(v=>v!==null);const lo=Math.max(0,Math.floor(Math.min(...all,APROB)-1)),hi=20;const X=i=>l+(L.length>1?i*(W-l-r)/(L.length-1):(W-l-r)/2),Y=v=>t+(hi-v)/(hi-lo)*(Ht-t-bt);let g='';for(let v=lo;v<=hi;v+=2)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/><text x="${l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#888">${v}</text>`;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(APROB)}" y2="${Y(APROB)}" stroke="#B4443D" stroke-dasharray="4 4"/><text x="${W-r}" y="${Y(APROB)-4}" font-size="10" text-anchor="end" fill="#B4443D">Aprobatoria ${APROB}</text>`;L.forEach((x,i)=>g+=`<text x="${X(i)}" y="${Ht-8}" font-size="11" text-anchor="middle" fill="#666">${x}</text>`);S.forEach(s=>{if(hid[s.n])return;let d='',pen=false;s.d.forEach((v,i)=>{if(v===null){pen=false;return;}d+=(pen?'L':'M')+X(i)+' '+Y(v);pen=true;});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}"/>`;s.d.forEach((v,i)=>{if(v!==null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${s.c}" stroke="#fff" data-tip="${esc(s.n)} · ${L[i]}: ${v}"/>`;});});return `<div class="legend">${S.map(s=>`<button class="lg ${hid[s.n]?'off':''}" data-lg="${esc(s.n)}"><i style="background:${s.c}"></i>${esc(s.n)}</button>`).join('')}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Ht}" style="width:100%;min-width:560px;height:auto">${g}</svg></div>`;}

function aResumen(){
  const l=lst(),b=AF().b,f=filtBar();
  const cs=CURSOS.map(c=>({c,...stat(vals(l,c,b))})).filter(x=>x.n);
  const gens=l.map(s=>pgen(s.id,b)).filter(v=>v!==null);
  if(!gens.length)return f+empty();
  const ries=gens.filter(v=>v<APROB).length,apG=Math.round((gens.length-ries)/gens.length*100);
  const avance=Math.round(mean(l.flatMap(s=>CURSOS.flatMap(c=>bset(b).map(x=>pctLleno(getRec(s.id,c,x)))))));
  const so=[...cs].sort((x,y)=>x.avg-y.avg),lo=so[0],hi=so[so.length-1];
  const lowAp=[...cs].sort((x,y)=>x.ap-y.ap)[0],disp=[...cs].sort((x,y)=>y.sd-x.sd)[0],wk=weak(l,lo.c,b);
  let cell=null;grados().forEach(g=>{if(AF().g!=='all'&&AF().g!=g)return;CURSOS.forEach(c=>{const st=stat(vals(studentsOf(g),c,b));if(st.n&&(!cell||st.avg<cell.avg))cell={g,c,avg:st.avg};});});
  const ins=[`El curso con <b>menor promedio</b> es <b>${lo.c}</b> (${lo.avg}) y el de <b>mayor promedio</b> es <b>${hi.c}</b> (${hi.avg}).`,
   lowAp.ap<100?`<b>${lowAp.c}</b> tiene la aprobación más baja: solo <b>${lowAp.ap}%</b> de los alumnos aprueba.`:'Todos los cursos tienen 100% de aprobación.',
   wk?`En ${lo.c}, el componente más débil es <b>${wk.l}</b> (prom. ${wk.v}): buen punto de partida para reforzar.`:'',
   cell?`El punto más crítico es <b>${cell.g}° en ${cell.c}</b>, con promedio ${cell.avg}.`:'',
   `<b>${ries}</b> de ${gens.length} alumnos (${100-apG}%) tienen promedio general menor a ${APROB}.`,
   disp&&disp.sd>=2.5?`<b>${disp.c}</b> tiene el rendimiento más desigual (desv. ${disp.sd}): conviven alumnos muy altos y muy bajos.`:''].filter(Boolean);
  return f+kpi([[mean(gens),'Promedio general',col(mean(gens))],[l.length,'Alumnos'],[apG+'%','Aprobación general',col(apG>=80?16:apG>=60?14:12)],[ries,'Alumnos en riesgo',ries?CLRB:''],[avance+'%','Avance del registro']])+
  `<div class="card" style="border-left:4px solid var(--ind)"><b style="font-family:inherit">Hallazgos clave</b><ul style="margin:8px 0 0;padding-left:20px;line-height:1.7;font-family:'Segoe UI',Arial;font-size:.88rem">${ins.map(i=>`<li>${i}</li>`).join('')}</ul></div>
  <div class="card"><b style="font-family:inherit">Promedio por curso</b> <span class="sub">(clic en un curso para ver su detalle)</span><div style="margin-top:10px">${bars(CURSOS.map(c=>{const st=stat(vals(l,c,b));return{l:c,v:st.avg,s:st.n?st.ap+'% aprob.':'',t:`${c}: ${st.n} alumnos, ${st.fail} desaprobados`,a:`data-gc="${esc(c)}"`};}))}</div></div>
  <div class="card"><b style="font-family:inherit">Mapa de calor: grado × curso</b> <span class="sub">(rojo = desaprobado, verde = alto rendimiento)</span><div style="margin-top:10px">${heat(b)}</div></div>`;
}

function aGrados(){
  const b=AF().b,f=filtBar({g:false});

function aAlumno(){
  const all=[...DATA.students].sort((a,b)=>a.grado-b.grado||a.nombre.localeCompare(b.nombre));
  if(!all.length)return empty('Sin alumnos.');
  const s=all.find(x=>x.id===window._as)||all[0],b=AF().b,peers=studentsOf(s.grado);
  const sel=`<div><label>Alumno</label><select id="asSel">${grados().map(g=>`<optgroup label="${g}° de Secundaria">${all.filter(x=>x.grado===g).map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
  const f=filtBar({g:false,x:sel}),gen=pgen(s.id,b);
  if(gen===null)return f+empty('Este alumno aún no tiene notas para el bimestre elegido.');
  const rank=peers.map(p=>pgen(p.id,b)).filter(v=>v!==null).sort((x,y)=>y-x),pos=rank.indexOf(gen)+1;
  const cs=CURSOS.map(c=>({c,v:pcs(s.id,c,b)})).filter(x=>x.v!==null).sort((x,y)=>x.v-y.v),bad=cs.filter(x=>x.v<APROB).length;
  const S=CURSOS.map((c,i)=>({n:c,c:PAL[i%PAL.length],d:BIMS.map(x=>promAlumnoCurso(s.id,c,x))}));S.push({n:'General',c:'#000',w:3.5,d:BIMS.map(x=>promAlumnoGeneral(s.id,x))});
  return f+kpi([[gen,'Promedio general',col(gen)],['#'+pos+' de '+rank.length,'Puesto en '+s.grado+'°'],[bad,'Cursos desaprobados',bad?CLRB:''],[mean(rank),'Promedio del grado']])+
  `<div class="card"><b style="font-family:inherit">Fortaleza y debilidad</b><div class="sub" style="margin:6px 0 0">Mayor fortaleza: <b>${esc(cs[cs.length-1].c)}</b> (${cs[cs.length-1].v}) · Curso a reforzar: <b>${esc(cs[0].c)}</b> (${cs[0].v})</div></div>

  <div class="card"><b style="font-family:inherit">Evolución por bimestre</b> <span class="sub">(clic en la leyenda para ocultar líneas)</span>${line(S,BIMS.map(x=>BIM_LABEL[x]))}</div>`;
}

function aRiesgo(){
  const l=lst(),b=AF().b,f=filtBar();
  const rows=l.map(s=>({s,gen:pgen(s.id,b),bad:CURSOS.map(c=>({c,v:pcs(s.id,c,b)})).filter(x=>x.v!==null&&x.v<APROB)})).filter(x=>x.gen!==null);
  if(!rows.length)return f+empty();
  const lv=x=>x.bad.length>=3||x.gen<APROB?['Alto','bad']:x.bad.length===2?['Medio','mid']:['Leve','mid'];
  const risk=rows.filter(x=>x.bad.length||x.gen<APROB).sort((p,q)=>q.bad.length-p.bad.length||p.gen-q.gen);
  const honor=[...rows].sort((p,q)=>q.gen-p.gen).slice(0,10);
  return f+kpi([[risk.length,'Alumnos con alerta',risk.length?CLRB:''],[risk.filter(x=>lv(x)[0]==='Alto').length,'Riesgo alto',CLRB],[Math.round(risk.length/rows.length*100)+'%','Del total evaluado']])+
  `<div class="card"><b style="font-family:inherit">Alumnos que necesitan apoyo</b> <span class="sub">(Alto: 3+ cursos desaprobados o promedio general &lt; ${APROB}; clic para ver su perfil)</span>${risk.length?`<div style="overflow-x:auto"><table><thead><tr><th>Alumno</th><th>Grado</th><th>Prom. gen.</th><th>Cursos desaprobados</th><th>Riesgo</th></tr></thead><tbody>${risk.map(x=>`<tr data-gs="${x.s.id}" style="cursor:pointer"><td>${esc(x.s.nombre)}</td><td>${x.s.grado}°</td><td class="${estadoClass(x.gen)}">${x.gen}</td><td>${x.bad.map(y=>`<span class="pill bad" style="margin-right:4px">${esc(y.c)} ${y.v}</span>`).join('')}</td><td><span class="pill ${lv(x)[1]}">${lv(x)[0]}</span></td></tr>`).join('')}</tbody></table></div>`:empty('Ningún alumno con alerta 🎉')}</div>
  <div class="card"><b style="font-family:inherit">🏆 Cuadro de mérito (top 10)</b><table><thead><tr><th>#</th><th>Alumno</th><th>Grado</th><th>Prom. gen.</th></tr></thead><tbody>${honor.map((x,i)=>`<tr data-gs="${x.s.id}" style="cursor:pointer"><td>${i+1}</td><td>${esc(x.s.nombre)}</td><td>${x.s.grado}°</td><td class="aprob">${x.gen}</td></tr>`).join('')}</tbody></table></div>`;
}

function aTend(){
  const l=lst(),f=filtBar({b:false});
  const S=CURSOS.map((c,i)=>({n:c,c:PAL[i%PAL.length],d:BIMS.map(x=>mean(vals(l,c,x)))}));

function exportExcel(){
  const wb=XLSX.utils.book_new();
  const alumRows=[['N°','Nombre','Grado']];
  DATA.students.forEach((s,i)=>alumRows.push([i+1,s.nombre,GRADO_LABEL[s.grado]||s.grado]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(alumRows),'Alumnos');
  const notasHead=['Bimestre','Grado','Curso','Alumno',...acols().map(c=>c.name),'Promedio','Estado'];
  const notasRows=[notasHead];
  DATA.students.forEach(s=>{
    CURSOS.forEach(c=>{
      BIMS.forEach(b=>{
        const r=getRec(s.id,c,b);
        if(!r)return;
        const prom=computeProm(r);
        const estado=prom===null?'':(prom>=APROB?'Aprobado':'Desaprobado');
        notasRows.push([b,GRADO_LABEL[s.grado]||s.grado,c,s.nombre,...acols().map(k=>r[k.id]),prom,estado]);
      });
    });
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(notasRows),'Notas');
  XLSX.writeFile(wb,'Notas_'+AREA.name.replace(/\s+/g,'_')+'_Los_Angeles_de_Jesus.xlsx');
}

async function importExcel(file){
  if(!file)return;
  showLoading('Actualizando base de datos...');
  setLoading('Leyendo el archivo...',3);
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const sheetName=wb.SheetNames.find(n=>n.toLowerCase()==='notas')||wb.SheetNames[0];
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
    const clean=v=>(v===null||v===undefined||v==='')?null:Number(v);
    const total=rows.length||1;
    const batch=new Map();
    let n=0,i=0;
    for(const r of rows){
      i++;
      const alumno=r['Alumno']; const grado=parseGradoNum(r['Grado']); const curso=r['Curso']; const bim=Number(r['Bimestre']);
      if(!alumno||!grado||!curso||!bim||!CURSOS.includes(curso))continue;
      const s=await findOrCreateStudentRemote(alumno,grado);
      if(!s)continue;
      DATA.records[s.id]=DATA.records[s.id]||{};
      DATA.records[s.id][curso]=DATA.records[s.id][curso]||{};
      const rec={...(DATA.records[s.id][curso][bim]||{})};
      AREA.cols.forEach(c=>{const key=[c.name,c.x].find(k=>k&&(k in r));if(key!==undefined)rec[c.id]=clean(r[key]);});
      DATA.records[s.id][curso][bim]=rec;
      batch.set(s.id+'|'+curso+'|'+bim,{sid:s.id,area:AREA.id,curso,bim,scores:rec});
      n++;
      if(i%5===0){setLoading(`Procesando alumnos: fila ${i} de ${rows.length}`,3+Math.round(i/total*47));await new Promise(r=>setTimeout(r,0));}
    }
    const all=[...batch.values()];
    const CH=200;
    for(let k=0;k<all.length;k+=CH){
      const chunk=all.slice(k,k+CH);
      setLoading(`Guardando notas en la nube: ${Math.min(k+CH,all.length)} de ${all.length}`,50+Math.round(Math.min(k+CH,all.length)/all.length*50));
      const {error}=await sb.from('grades').upsert(chunk,{onConflict:'sid,area,curso,bim'});
      if(error)throw new Error(error.message);
    }
    setLoading('Listo',100);
    hideLoading();
    window._importFile=null;
    window._importMsg=`Importación completa: ${n} registros de notas actualizados en la nube.`;
    render();
  }catch(e){
    hideLoading();
    window._importMsg='No se pudo actualizar la base de datos. Verifica que el archivo tenga una hoja "Notas" con las columnas Bimestre, Grado, Curso, Alumno y las notas.'+(e&&e.message?' ('+e.message+')':'');
    render();
  }
}

function descargarReporteCompleto(bim){
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const NAVY=[27,42,65],GREEN=[47,107,74],RED=[180,68,61];
  const fmt=v=>(v===null||v===undefined)?'-':String(Math.round(v*100)/100);
  const titulo=(t,s)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...NAVY);doc.text(t,148.5,15,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90,90,90);doc.text(s,148.5,21,{align:'center'});
  };
  const base={theme:'grid',headStyles:{fillColor:[236,231,218],textColor:[68,68,68],fontStyle:'bold',halign:'center',fontSize:8,lineColor:[216,210,194]},styles:{fontSize:8.5,cellPadding:1.8,lineColor:[216,210,194],textColor:[32,35,43],fillColor:[255,255,255]},margin:{left:14,right:14}};
  const gs=grados();
  let first=true;

  // Parte 1: consolidado por grado
  gs.forEach(g=>{
    const list=studentsOf(g); if(!list.length)return;
    if(!first)doc.addPage(); first=false;
    titulo(`CONSOLIDADO DE NOTAS - ${g}° DE SECUNDARIA`,`${BIM_LABEL[bim]} Bimestre · Colegio Los Ángeles de Jesús`);
    const body=list.map((s,i)=>[i+1,s.nombre,...CURSOS.map(c=>fmt(promAlumnoCurso(s.id,c,bim))),fmt(promAlumnoGeneral(s.id,bim))]);
    doc.autoTable({...base,startY:26,head:[['N°','Alumno',...CURSOS.map(c=>c.toUpperCase()),'PROM. GEN.']],body,
      columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:58}},
      didParseCell:d=>{
        if(d.section==='body'&&d.column.index>=2){
          d.cell.styles.halign='center';
          if(d.column.index===CURSOS.length+2){const v=parseFloat(d.cell.raw);if(!isNaN(v)){d.cell.styles.textColor=v>=APROB?GREEN:RED;d.cell.styles.fontStyle='bold';}}
        }
      }});
  });

  // Parte 2: registros por grado y curso
  gs.forEach(g=>{
    const list=studentsOf(g); if(!list.length)return;
    doc.addPage();
    titulo(`REGISTRO AUXILIAR - ${g}° DE SECUNDARIA`,`${BIM_LABEL[bim]} Bimestre · Colegio Los Ángeles de Jesús · Nota mínima aprobatoria: ${APROB}`);
    let y=28;
    CURSOS.forEach(c=>{
      if(y>165){doc.addPage();y=15;}
      doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...NAVY);doc.text(c.toUpperCase(),14,y);
      const body=list.map((s,i)=>{
        const r=getRec(s.id,c,bim);
        const prom=computeProm(r);
        const estado=prom===null?'-':(prom>=APROB?'Aprobado':'Desaprobado');
        return [i+1,s.nombre,...groups().map(g=>fmt(gval(r,g))),fmt(prom),estado];
      });
      doc.autoTable({...base,startY:y+2,head:[['N°','Alumno',...groups().map(g=>g.label),'Promedio','Estado']],body,
        styles:{...base.styles,fontSize:8,cellPadding:1.4},
        columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:62}},
        didParseCell:d=>{
          if(d.section==='body'&&d.column.index>=2){
            d.cell.styles.halign='center';
            if(d.column.index===groups().length+3){
              if(d.cell.raw==='Aprobado')d.cell.styles.textColor=GREEN;
              else if(d.cell.raw==='Desaprobado')d.cell.styles.textColor=RED;
            }
          }
        }});
      y=doc.lastAutoTable.finalY+9;
    });
  });

  doc.save(`Reporte_Completo_${BIM_LABEL[bim]}_Bimestre.pdf`);
}

(async function start(){
  const {data:{session:s}}=await sb.auth.getSession();
  if(s){ session=s; if(await afterLogin()) render(); }
  else { renderLogin(); }
})();
